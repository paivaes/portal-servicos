# Configuração do backend para se conectar com o Netlify e o GitHub
# Configuração do backend
# Configuração do backend
backend:
  name: git-gateway
  branch: main

# Configuração de mídia
media_folder: "img"
public_folder: "/img"

# Definição das coleções
collections:
  - name: "sponsors"
    label: "Parceiros"
    folder: "_sponsors"
    create: true
    slug: "{{slug}}"
    fields: # Lista de campos para cada Parceiro
      - { label: "Ordem de Exibição", name: "order", widget: "number", min: 1, default: 100 }
      # ===== NOVO CAMPO DE CATEGORIA ADICIONADO AQUI =====
      - label: "Categoria"
        name: "category"
        widget: "select"
        options: ["Ouro", "Prata", "Bronze"] # <- Altere estas opções como desejar
      # ====================================================
      - { label: "Nome do Parceiro", name: "name", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image" }
      - { label: "Telefone", name: "phone", widget: "string" }
      - { label: "Endereço", name: "address", widget: "string" }
